# Every night at 01:00 Spain time (00:00 UTC) read the new comments on the
# Brand_2_BibleFun reels and answer each one kindly (scripts/reels/comments.ts).
# Needs the repository secrets UPLOAD_POST_BGP_API_KEY and OPENAI_API_KEY.
name: Reel comments

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

concurrency:
  group: reel-comments

jobs:
  reply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/reels/comments.ts
          sparse-checkout-cone-mode: false
      - uses: oven-sh/setup-bun@v2
      - uses: actions/cache/restore@v4
        with:
          path: scripts/reels/comments-state.json
          key: reel-comments-${{ github.run_id }}
          restore-keys: reel-comments-
      - name: Answer new comments
        run: bun scripts/reels/comments.ts
        env:
          UPLOAD_POST_BGP_API_KEY: ${{ secrets.UPLOAD_POST_BGP_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      - uses: actions/cache/save@v4
        if: always() && hashFiles('scripts/reels/comments-state.json') != ''
        with:
          path: scripts/reels/comments-state.json
          key: reel-comments-${{ github.run_id }}
